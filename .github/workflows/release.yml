name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -buildid=" -o "dist/ztgotroller-${GOOS}-${GOARCH}${suffix}" ./cmd/ztgotroller
          go build -trimpath -ldflags="-s -w -buildid=" -o "dist/ztgotroller-backup-${GOOS}-${GOARCH}${suffix}" ./cmd/ztgotroller-backup
          cd dist
          sha256sum -- ./* > "SHA256SUMS-${GOOS}-${GOARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
