name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - run: go test ./...
      - run: go test -race ./internal/api/httpapi ./internal/controller ./internal/store/... ./internal/zerotier/networkconfig ./internal/zerotier/transport
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-buildid=" ./cmd/ztgotroller ./cmd/ztgotroller-backup

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
